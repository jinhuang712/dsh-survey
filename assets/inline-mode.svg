<svg xmlns="http://www.w3.org/2000/svg" width="812" height="856" viewBox="0 0 812 856" role="img" aria-label="Inline survey embedded in the conversation column: a single-choice, a multi-select and an open question, all submitted together.">
<title>dsh-survey — inline mode</title>
<style>
:root{
  --base:#ffffff; --card:#ffffff; --cardline:#e6e6e6;
  --l1:#f5f5f5; --l2:#e6e6e6; --l4:#d6d6d6;
  --fg1:#0f1115; --fg2:#61666b; --fg3:#81858c; --fg4:#adb2b8;
  --pillbg:#e4edfd; --pillfg:#4176e6;
  --hover:#f2f3f4; --markbg:#e9ecf2;
  --sel:#0f1115; --selfg:#ffffff;
  --btn:#0f1115; --btnfg:#ffffff;
  --field:#f5f6f7; --code:#ffffff;
  --griditem:#ffffff; --gridline:#f5f5f5; --gridhover:#f2f3f4;
  --scrim:#ffffff;
}
@media (prefers-color-scheme:dark){:root{
  --base:#151517; --card:#2c2c2e; --cardline:#39393b;
  --l1:#39393b; --l2:#454547; --l4:#565658;
  --fg1:#f9fafb; --fg2:#cfd3d6; --fg3:#adb2b8; --fg4:#81858c;
  --pillbg:#353638; --pillfg:#679efe;
  --hover:#3d3d3f; --markbg:#61666b;
  --sel:#f9fafb; --selfg:#0f1115;
  --btn:#f9fafb; --btnfg:#0f1115;
  --field:#353638; --code:#2c2c2e;
  --griditem:#232324; --gridline:#303031; --gridhover:#353536;
  --scrim:#151517;
}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-weight:400}
.page{fill:var(--base)}
.frame{fill:none;stroke:var(--l2);stroke-width:1}
.card{fill:var(--card);stroke:var(--cardline);stroke-width:1}
.rule{fill:var(--l1)}
.item{fill:var(--griditem)}
.itemline{fill:none;stroke:var(--gridline);stroke-width:1}
.hoverbox{fill:var(--hover);stroke:var(--l2);stroke-width:1}
.gridsel{fill:var(--gridhover);stroke:var(--l2);stroke-width:1}
.markbg{fill:var(--markbg)}
.field{fill:var(--field);stroke:var(--l2);stroke-width:1}
.hairbox{fill:none;stroke:var(--l2);stroke-width:1}
.codebg{fill:var(--code);stroke:var(--l1);stroke-width:1}
.pill{fill:var(--pillbg)}
.btn{fill:var(--btn)}
.scrim{fill:var(--scrim);fill-opacity:.55}
.ringoff{fill:none;stroke:var(--l4);stroke-width:1}
.ringon{fill:var(--sel);stroke:none}
.dot{fill:var(--selfg)}
.check{fill:none;stroke:var(--selfg);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon{fill:none;stroke:var(--fg3);stroke-width:1.33;stroke-linecap:round}
.iconm{fill:none;stroke:var(--fg2);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.quote{fill:var(--l2)}
.eyebrow{font-size:11px;letter-spacing:.44px;fill:var(--fg3)}
.title{font-size:16px;font-weight:500;fill:var(--fg1)}
.qindex{font-size:13px;font-weight:700;letter-spacing:.26px;fill:var(--fg4)}
.qhead{font-size:13px;font-weight:700;letter-spacing:.26px;fill:var(--fg2)}
.qtext{font-size:14px;font-weight:500;letter-spacing:-.07px;fill:var(--fg1)}
.opt{font-size:14px;font-weight:500;fill:var(--fg1)}
.desc{font-size:14px;fill:var(--fg3)}
.badge{font-size:11px;font-weight:600;fill:var(--pillfg)}
.type{font-size:11px;font-weight:600;letter-spacing:.22px;fill:var(--pillfg)}
.ph{font-size:14px;fill:var(--fg4)}
.prog{font-size:14px;font-weight:500;fill:var(--fg2)}
.progb{fill:var(--fg1)}
.btnt{font-size:14px;fill:var(--btnfg)}
.skip{font-size:14px;fill:var(--fg3)}
.md{font-size:13px;fill:var(--fg3)}
.mdq{font-size:13px;fill:var(--fg2)}
.mono{font-size:12px;fill:var(--fg2);
  font-family:"SF Mono","JetBrains Mono","Fira Code",Consolas,Menlo,monospace}
.warn{fill:#e5534b}
.gq{font-size:13px;font-weight:500;fill:var(--fg1)}
.gopt{font-size:12px;font-weight:500;fill:var(--fg1)}
.gside{font-size:11px;font-weight:600;fill:var(--fg2)}
.gsideon{font-size:11px;font-weight:600;fill:var(--selfg)}
.gskip{font-size:12px;fill:var(--fg3)}
.cmp{font-size:14px;font-weight:500;fill:var(--fg1)}
.num{font-size:11px;font-weight:500;fill:var(--fg2)}
.chat{font-size:14px;fill:var(--fg2)}
.chatu{font-size:14px;fill:var(--fg1)}
</style>
<rect x="0" y="0" width="812" height="856" rx="14" class="page"/>
<defs><clipPath id="cp"><rect x="0" y="0" width="812" height="856" rx="14"/></clipPath><filter id="blur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2"/></filter></defs>
<g clip-path="url(#cp)">
<text x="32" y="42" class="chatu">Plan the v2 migration — ask me before you commit to a path.</text>
<text x="32" y="70" class="chat">Four decisions first. Sending a survey.</text>
<rect x="32.5" y="86.5" width="747" height="739" rx="20" class="card"/>
<text x="56" y="117.3" class="eyebrow">SURVEY · 3 QUESTIONS</text>
<text x="56" y="142.8" class="title">Answer these, then submit together</text>
<path d="M746.5 112.5L757.5 123.5M757.5 112.5L746.5 123.5" class="icon"/>
<text x="744" y="177.97" class="skip" text-anchor="middle">✕</text>
<rect x="682.697" y="164" width="43.303" height="18" rx="6" class="pill"/>
<text x="686.697" y="176.3" class="type">Single</text>
<text x="56" y="173.9" class="qindex">1 ·</text>
<text x="79.075" y="173.9" class="qhead">Runtime</text>
<rect x="142.729" y="169.5" width="529.968" height="1" class="rule"/>
<text x="56" y="207.2" class="qtext">Which runtime does this ship on?</text>
<rect x="56.5" y="227.5" width="699" height="39" rx="12" class="hoverbox"/>
<circle cx="74" cy="247" r="7" class="ringon"/>
<circle cx="74" cy="247" r="3" class="dot"/>
<text x="92" y="251.2" class="opt">Node 20 LTS</text>
<rect x="182.403" y="238" width="89.44" height="18" rx="6" class="pill"/>
<text x="186.403" y="250.3" class="badge">Recommended</text>
<text x="277.843" y="251.2" class="desc">Matches the CI base image.</text>
<circle cx="74" cy="288" r="6.5" class="ringoff"/>
<text x="92" y="292.2" class="opt">Bun 1.1</text>
<text x="143.876" y="292.2" class="desc">Faster boot, fewer native addons.</text>
<rect x="64" y="319" width="20" height="20" rx="6" class="markbg"/>
<path d="M69 334l0-2.6 6.8-6.8 2.6 2.6-6.8 6.8zM75.8 325.2l1.3-1.3 2.6 2.6-1.3 1.3" class="iconm"/>
<text x="92" y="333.2" class="ph">Custom answer (optional)</text>
<text x="744" y="377.97" class="skip" text-anchor="middle">✕</text>
<rect x="689.529" y="364" width="36.471" height="18" rx="6" class="pill"/>
<text x="693.529" y="376.3" class="type">Multi</text>
<text x="56" y="373.9" class="qindex">2 ·</text>
<text x="80.782" y="373.9" class="qhead">Scope</text>
<rect x="130.396" y="369.5" width="549.133" height="1" class="rule"/>
<text x="56" y="407.2" class="qtext">Which surfaces need the rewrite?</text>
<rect x="56.5" y="427.5" width="699" height="39" rx="12" class="hoverbox"/>
<rect x="67" y="440" width="14" height="14" rx="4" class="ringon"/>
<path d="M70.6 447.2L73 449.8L77.4 444.4" class="check"/>
<text x="92" y="451.2" class="opt">Web client</text>
<text x="167.414" y="451.2" class="desc">Toolviews and the composer.</text>
<rect x="56.5" y="468.5" width="699" height="39" rx="12" class="hoverbox"/>
<rect x="67" y="481" width="14" height="14" rx="4" class="ringon"/>
<path d="M70.6 488.2L73 490.8L77.4 485.4" class="check"/>
<text x="92" y="492.2" class="opt">CLI</text>
<text x="119.745" y="492.2" class="desc">Flag parsing only.</text>
<rect x="67.5" y="522.5" width="13" height="13" rx="4" class="ringoff"/>
<text x="92" y="533.2" class="opt">Docs site</text>
<text x="159.178" y="533.2" class="desc">Regenerated from the schema.</text>
<rect x="64" y="560" width="20" height="20" rx="6" class="markbg"/>
<path d="M69 575l0-2.6 6.8-6.8 2.6 2.6-6.8 6.8zM75.8 566.2l1.3-1.3 2.6 2.6-1.3 1.3" class="iconm"/>
<text x="92" y="574.2" class="ph">Custom answer (optional)</text>
<text x="744" y="618.97" class="skip" text-anchor="middle">✕</text>
<rect x="688.046" y="605" width="37.954" height="18" rx="6" class="pill"/>
<text x="692.046" y="617.3" class="type">Open</text>
<text x="56" y="614.9" class="qindex">3 ·</text>
<text x="81.119" y="614.9" class="qhead">Notes</text>
<rect x="128.572" y="610.5" width="549.474" height="1" class="rule"/>
<text x="56" y="648.2" class="qtext">Anything the changelog should call out?</text>
<rect x="56.5" y="672.5" width="699" height="63" rx="10" class="field"/>
<text x="68" y="696.2" class="ph">Type your answer</text>
<text x="50" y="788.2" class="prog">Answered <tspan class="progb">2</tspan> / 3</text>
<rect x="617.503" y="766" width="148.497" height="36" rx="18" class="btn"/>
<text x="691.751" y="788.97" class="btnt" text-anchor="middle">Submit all answers</text>
</g>
<rect x="0.5" y="0.5" width="811" height="855" rx="13.5" class="frame"/>
</svg>
