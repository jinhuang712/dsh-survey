<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="Fullscreen grid matrix: eight short questions as equal-height cards with bottom-aligned controls, per-card skip and one submit.">
<title>dsh-survey — grid matrix mode</title>
<style>
:root{
  --base:#ffffff; --card:#ffffff; --cardline:#e6e6e6;
  --l1:#f5f5f5; --l2:#e6e6e6; --l4:#d6d6d6;
  --fg1:#0f1115; --fg2:#61666b; --fg3:#81858c; --fg4:#adb2b8;
  --pillbg:#e4edfd; --pillfg:#4176e6;
  --hover:#f2f3f4; --markbg:#e9ecf2;
  --sel:#0f1115; --selfg:#ffffff;
  --btn:#0f1115; --btnfg:#ffffff;
  --field:#f5f6f7; --code:#ffffff;
  --griditem:#ffffff; --gridline:#f5f5f5; --gridhover:#f2f3f4;
  --scrim:#ffffff;
}
@media (prefers-color-scheme:dark){:root{
  --base:#151517; --card:#2c2c2e; --cardline:#39393b;
  --l1:#39393b; --l2:#454547; --l4:#565658;
  --fg1:#f9fafb; --fg2:#cfd3d6; --fg3:#adb2b8; --fg4:#81858c;
  --pillbg:#353638; --pillfg:#679efe;
  --hover:#3d3d3f; --markbg:#61666b;
  --sel:#f9fafb; --selfg:#0f1115;
  --btn:#f9fafb; --btnfg:#0f1115;
  --field:#353638; --code:#2c2c2e;
  --griditem:#232324; --gridline:#303031; --gridhover:#353536;
  --scrim:#151517;
}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-weight:400}
.page{fill:var(--base)}
.frame{fill:none;stroke:var(--l2);stroke-width:1}
.card{fill:var(--card);stroke:var(--cardline);stroke-width:1}
.rule{fill:var(--l1)}
.item{fill:var(--griditem)}
.itemline{fill:none;stroke:var(--gridline);stroke-width:1}
.hoverbox{fill:var(--hover);stroke:var(--l2);stroke-width:1}
.gridsel{fill:var(--gridhover);stroke:var(--l2);stroke-width:1}
.markbg{fill:var(--markbg)}
.field{fill:var(--field);stroke:var(--l2);stroke-width:1}
.hairbox{fill:none;stroke:var(--l2);stroke-width:1}
.codebg{fill:var(--code);stroke:var(--l1);stroke-width:1}
.pill{fill:var(--pillbg)}
.btn{fill:var(--btn)}
.scrim{fill:var(--scrim);fill-opacity:.55}
.ringoff{fill:none;stroke:var(--l4);stroke-width:1}
.ringon{fill:var(--sel);stroke:none}
.dot{fill:var(--selfg)}
.check{fill:none;stroke:var(--selfg);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon{fill:none;stroke:var(--fg3);stroke-width:1.33;stroke-linecap:round}
.iconm{fill:none;stroke:var(--fg2);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.quote{fill:var(--l2)}
.eyebrow{font-size:11px;letter-spacing:.44px;fill:var(--fg3)}
.title{font-size:16px;font-weight:500;fill:var(--fg1)}
.qindex{font-size:13px;font-weight:700;letter-spacing:.26px;fill:var(--fg4)}
.qhead{font-size:13px;font-weight:700;letter-spacing:.26px;fill:var(--fg2)}
.qtext{font-size:14px;font-weight:500;letter-spacing:-.07px;fill:var(--fg1)}
.opt{font-size:14px;font-weight:500;fill:var(--fg1)}
.desc{font-size:14px;fill:var(--fg3)}
.badge{font-size:11px;font-weight:600;fill:var(--pillfg)}
.type{font-size:11px;font-weight:600;letter-spacing:.22px;fill:var(--pillfg)}
.ph{font-size:14px;fill:var(--fg4)}
.prog{font-size:14px;font-weight:500;fill:var(--fg2)}
.progb{fill:var(--fg1)}
.btnt{font-size:14px;fill:var(--btnfg)}
.skip{font-size:14px;fill:var(--fg3)}
.md{font-size:13px;fill:var(--fg3)}
.mdq{font-size:13px;fill:var(--fg2)}
.mono{font-size:12px;fill:var(--fg2);
  font-family:"SF Mono","JetBrains Mono","Fira Code",Consolas,Menlo,monospace}
.warn{fill:#e5534b}
.gq{font-size:13px;font-weight:500;fill:var(--fg1)}
.gopt{font-size:12px;font-weight:500;fill:var(--fg1)}
.gside{font-size:11px;font-weight:600;fill:var(--fg2)}
.gsideon{font-size:11px;font-weight:600;fill:var(--selfg)}
.gskip{font-size:12px;fill:var(--fg3)}
.cmp{font-size:14px;font-weight:500;fill:var(--fg1)}
.num{font-size:11px;font-weight:500;fill:var(--fg2)}
.chat{font-size:14px;fill:var(--fg2)}
.chatu{font-size:14px;fill:var(--fg1)}
</style>
<rect x="0" y="0" width="1280" height="620" rx="14" class="page"/>
<defs><clipPath id="cp"><rect x="0" y="0" width="1280" height="620" rx="14"/></clipPath><filter id="blur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2"/></filter></defs>
<g clip-path="url(#cp)">
<g filter="url(#blur)">
<text x="266" y="46" class="chatu">Compare the two migration paths and let me pick one.</text>
<text x="266" y="76" class="chat">Both are viable. Laying them out side by side.</text>
<text x="266" y="100" class="chat">The write path is identical either way, so the whole</text>
<text x="266" y="124" class="chat">difference — and the whole risk — sits in the read flip.</text>
<rect x="266.5" y="556.5" width="747" height="51" rx="24" class="hairbox"/>
<text x="286" y="587" class="ph">Reply to dsh…</text>
</g>
<rect x="0" y="0" width="1280" height="620" class="scrim"/>
<rect x="50.5" y="84.5" width="1179" height="442" rx="20" class="card"/>
<text x="74" y="115.3" class="eyebrow">SURVEY MATRIX · 8 QUESTIONS</text>
<text x="74" y="140.8" class="title">Answer each, then submit together</text>
<path d="M1196.5 110.5L1207.5 121.5M1207.5 110.5L1196.5 121.5" class="icon"/>
<g>
<rect x="74" y="159" width="275.5" height="132" rx="12" class="item"/>
<rect x="74.5" y="159.5" width="274.5" height="131" rx="11.5" class="itemline"/>
<text x="86" y="182.4" class="gq">1. Enable the new indexer on the</text>
<text x="86" y="201.4" class="gq">write path?</text>
<text x="326.5" y="184.26" class="gskip" text-anchor="middle">✕</text>
<rect x="86.5" y="256.5" width="79.548" height="24" rx="12.5" class="hairbox"/>
<rect x="89" y="259" width="39.359" height="19" rx="9.5" class="ringon"/>
<text x="108.68" y="272.405" class="gsideon" text-anchor="middle">Yes</text>
<text x="145.954" y="272.405" class="gside" text-anchor="middle">No</text>
</g>
<g>
<rect x="359.5" y="159" width="275.5" height="132" rx="12" class="item"/>
<rect x="360" y="159.5" width="274.5" height="131" rx="11.5" class="itemline"/>
<text x="371.5" y="182.4" class="gq">2. Drop the legacy /v1 route in this</text>
<text x="371.5" y="201.4" class="gq">release?</text>
<text x="612" y="184.26" class="gskip" text-anchor="middle">✕</text>
<rect x="372" y="256.5" width="79.548" height="24" rx="12.5" class="hairbox"/>
<text x="394.18" y="272.405" class="gside" text-anchor="middle">Yes</text>
<rect x="413.859" y="259" width="35.189" height="19" rx="9.5" class="ringon"/>
<text x="431.453" y="272.405" class="gsideon" text-anchor="middle">No</text>
</g>
<g>
<rect x="645" y="159" width="275.5" height="132" rx="12" class="item"/>
<rect x="645.5" y="159.5" width="274.5" height="131" rx="11.5" class="itemline"/>
<text x="657" y="182.4" class="gq">3. Backfill historical rows before the</text>
<text x="657" y="201.4" class="gq">cutover?</text>
<text x="897.5" y="184.26" class="gskip" text-anchor="middle">✕</text>
<rect x="657.5" y="256.5" width="79.548" height="24" rx="12.5" class="hairbox"/>
<rect x="660" y="259" width="39.359" height="19" rx="9.5" class="ringon"/>
<text x="679.679" y="272.405" class="gsideon" text-anchor="middle">Yes</text>
<text x="716.954" y="272.405" class="gside" text-anchor="middle">No</text>
</g>
<g>
<rect x="930.5" y="159" width="275.5" height="132" rx="12" class="item"/>
<rect x="931" y="159.5" width="274.5" height="131" rx="11.5" class="itemline"/>
<text x="942.5" y="182.4" class="gq">4. Which queue handles retries?</text>
<text x="1183" y="184.26" class="gskip" text-anchor="middle">✕</text>
<rect x="943" y="215.5" width="250.5" height="31" rx="8" class="gridsel"/>
<circle cx="958.5" cy="231" r="7" class="ringon"/>
<circle cx="958.5" cy="231" r="3" class="dot"/>
<text x="974.5" y="235.26" class="gopt">Kafka</text>
<circle cx="958.5" cy="265" r="6.5" class="ringoff"/>
<text x="974.5" y="269.26" class="gopt">SQS</text>
</g>
<g>
<rect x="74" y="301" width="275.5" height="132" rx="12" class="item"/>
<rect x="74.5" y="301.5" width="274.5" height="131" rx="11.5" class="itemline"/>
<text x="86" y="324.4" class="gq">5. Pin the Node version in the CI</text>
<text x="86" y="343.4" class="gq">image?</text>
<text x="326.5" y="326.26" class="gskip" text-anchor="middle">✕</text>
<rect x="86.5" y="398.5" width="79.548" height="24" rx="12.5" class="hairbox"/>
<rect x="89" y="401" width="39.359" height="19" rx="9.5" class="ringon"/>
<text x="108.68" y="414.405" class="gsideon" text-anchor="middle">Yes</text>
<text x="145.954" y="414.405" class="gside" text-anchor="middle">No</text>
</g>
<g opacity=".45">
<rect x="359.5" y="301" width="275.5" height="132" rx="12" class="item"/>
<rect x="360" y="301.5" width="274.5" height="131" rx="11.5" class="itemline"/>
<text x="371.5" y="324.4" class="gq">6. Emit deprecation warnings for v1</text>
<text x="371.5" y="343.4" class="gq">callers?</text>
<text x="612" y="326.26" class="gskip" text-anchor="middle">↺</text>
<rect x="372" y="398.5" width="79.548" height="24" rx="12.5" class="hairbox"/>
<text x="394.18" y="414.405" class="gside" text-anchor="middle">Yes</text>
<text x="431.453" y="414.405" class="gside" text-anchor="middle">No</text>
</g>
<g>
<rect x="645" y="301" width="275.5" height="132" rx="12" class="item"/>
<rect x="645.5" y="301.5" width="274.5" height="131" rx="11.5" class="itemline"/>
<text x="657" y="324.4" class="gq">7. Default log level in production?</text>
<text x="897.5" y="326.26" class="gskip" text-anchor="middle">✕</text>
<rect x="657.5" y="357.5" width="250.5" height="31" rx="8" class="gridsel"/>
<circle cx="673" cy="373" r="7" class="ringon"/>
<circle cx="673" cy="373" r="3" class="dot"/>
<text x="689" y="377.26" class="gopt">info</text>
<circle cx="673" cy="407" r="6.5" class="ringoff"/>
<text x="689" y="411.26" class="gopt">debug</text>
</g>
<g>
<rect x="930.5" y="301" width="275.5" height="132" rx="12" class="item"/>
<rect x="931" y="301.5" width="274.5" height="131" rx="11.5" class="itemline"/>
<text x="942.5" y="324.4" class="gq">8. Add a rollback runbook to the</text>
<text x="942.5" y="343.4" class="gq">PR?</text>
<text x="1183" y="326.26" class="gskip" text-anchor="middle">✕</text>
<rect x="943" y="398.5" width="79.548" height="24" rx="12.5" class="hairbox"/>
<rect x="945.5" y="401" width="39.359" height="19" rx="9.5" class="ringon"/>
<text x="965.179" y="414.405" class="gsideon" text-anchor="middle">Yes</text>
<text x="1002.45" y="414.405" class="gside" text-anchor="middle">No</text>
</g>
<text x="68" y="489.2" class="prog">Answered <tspan class="progb">7</tspan> / 8</text>
<rect x="1067.5" y="467" width="148.497" height="36" rx="18" class="btn"/>
<text x="1141.75" y="489.97" class="btnt" text-anchor="middle">Submit all answers</text>
</g>
<rect x="0.5" y="0.5" width="1279" height="619" rx="13.5" class="frame"/>
</svg>
